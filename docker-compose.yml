services:
  kb:
    image: pgvector/pgvector:pg16
    container_name: frontier-kb-pg
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-frontier}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-frontier}
      POSTGRES_DB: ${POSTGRES_DB:-frontier_kb}
    ports:
      - "${KB_BIND:-127.0.0.1}:55432:5432"
    command: ["postgres", "-c", "max_connections=200"]
    restart: unless-stopped
    volumes:
      - kb_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U frontier -d frontier_kb"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  kb_pg_data:
