# Overlay for a designated private deployment host.
# Defaults to loopback. Set FRONTIER_KB_BIND_HOST in local/private configuration
# to expose the store on a trusted network address.
# docker compose -f docker-compose.yml -f docker-compose.host-0.yml up -d kb
services:
  kb:
    ports:
      - "${FRONTIER_KB_BIND_HOST:-127.0.0.1}:${KB_PORT:-55442}:5432"
